<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#0b253d">
  <title>Analytics | TimeStock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&amp;family=Poppins:wght@600;700&amp;display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp">
  <link rel="stylesheet" href="/login-assets/analytics/analytics.css">
</head>
<body class="ts-analytics-page">
  <div class="container ts-analytics-shell">
    {% include "sidebar.html" %}

    <main id="main-content" class="ts-analytics-main">
      <div
        id="timestock-analytics-root"
        data-first-name="{{ user['firstname'] | e }}"
        data-last-name="{{ user['lastname'] | e }}"
        data-role="{{ user['role'] | e }}"
      >
        <noscript>JavaScript is required to view TimeStock analytics.</noscript>
      </div>
    </main>
  </div>

  <script id="timestock-analytics-data" type="application/json">
    {
      "charts": {
        "performance": {{ chart_html.rsplit('Plotly.newPlot(', 1)[-1] | tojson }},
        "turnover": {{ turnover_combined_html.rsplit('Plotly.newPlot(', 1)[-1] | tojson }},
        "stl": {{ stl_html.rsplit('Plotly.newPlot(', 1)[-1] | tojson }},
        "movingAverage": {{ ma_chart_html.rsplit('Plotly.newPlot(', 1)[-1] | tojson }}
      },
      "reports": {
        "performance": {{ chart_report | tojson }},
        "turnover": {{ summary | tojson }},
        "stl": {{ stl_report | tojson }},
        "movingAverage": {{ ma_report | tojson }}
      },
      "recommendations": {
        "stlFlat": {{ stl_recommendation | tojson }},
        "stlGrouped": {{ stl_recommendation_grouped | tojson }},
        "stlConfidence": {{ stl_confidence | tojson }},
        "movingAverage": {{ ma_recommendation | tojson }}
      }
    }
  </script>
  <script type="module" src="/login-assets/analytics/analytics.js"></script>
</body>
</html>
