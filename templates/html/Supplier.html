<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#0b253d">
  <title>Suppliers | TimeStock</title>
  <link rel="icon" href="/images/TIMESTOCK_BG.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&amp;family=Poppins:wght@600;700&amp;display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp">
  <link rel="stylesheet" href="/login-assets/suppliers/suppliers.css">
</head>
<body class="ts-products-page ts-suppliers-page">
  <a class="suppliers-skip-link" href="#main-content">Skip to supplier directory</a>
  <div class="container ts-products-shell ts-suppliers-shell">
    {% include "sidebar.html" %}

    <main id="main-content" class="ts-products-main ts-suppliers-main">
      <div
        id="timestock-suppliers-root"
        data-first-name="{{ user['firstname'] | e }}"
        data-last-name="{{ user['lastname'] | e }}"
        data-role="{{ user['role'] | e }}"
      >
        <noscript>JavaScript is required to view TimeStock suppliers.</noscript>
      </div>
    </main>
  </div>

  <script type="module" src="/login-assets/suppliers/suppliers.js"></script>
</body>
</html>
