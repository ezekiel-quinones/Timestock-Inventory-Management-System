<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#0b253d">
  <title>Reports | TimeStock</title>
  <link rel="icon" href="/images/TIMESTOCK_BG.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&amp;family=Poppins:wght@600;700&amp;display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp">
  <link rel="stylesheet" href="/login-assets/reports/reports.css">
</head>
<body class="ts-products-page ts-reports-page">
  <a class="reports-skip-link" href="#main-content">Skip to report content</a>
  <div class="container ts-products-shell ts-reports-shell">
    {% include "sidebar.html" %}

    <main id="main-content" class="ts-products-main ts-reports-main">
      <div
        id="timestock-reports-root"
        data-first-name="{{ user['firstname'] | e }}"
        data-last-name="{{ user['lastname'] | e }}"
        data-role="{{ user['role'] | e }}"
        data-year="{{ year | default('') | e }}"
        data-month="{{ month | default('') | e }}"
      >
        <noscript>JavaScript is required to view TimeStock reports.</noscript>
      </div>
    </main>
  </div>

  <script id="timestock-reports-data" type="application/json">
    {
      "year": {{ year | default(none) | tojson }},
      "month": {{ month | default(none) | tojson }},
      "error": {{ error_message | default(none) | tojson }},
      "reports": {
        "sales": {{ report_text | default(none) | tojson }},
        "turnover": {{ turnover_report | default(none) | tojson }},
        "stl": {{ stl_report | default(none) | tojson }},
        "movingAverage": {{ moving_avg_report | default(none) | tojson }},
        "stockMovement": {{ stock_movement_report | default(none) | tojson }},
        "productsSold": {{ products_sold_report | default(none) | tojson }}
      }
    }
  </script>
  <script type="module" src="/login-assets/reports/reports.js"></script>
</body>
</html>
